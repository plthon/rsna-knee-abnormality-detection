[preprocessing]
slice_count = 8
lower_percentile = 1
upper_percentile = 99
image_size = 224

[training]
epochs = 3
# An approved Tesla T4 attempt at batch 16 exhausted 14.22 GiB of PyTorch
# allocations and failed on a further 556 MiB allocation.
batch_size = 4
gradient_accumulation_steps = 4
learning_rate = 0.0001
weight_decay = 0.0001
seed = 20260825
mixed_precision = true
architecture = "dinov2_vits14"
weight_identity = "dinov2_vits14.LVD142M"

[split]
val_fraction = 0.10
seed = 20260825

[validation]
reload_absolute_tolerance = 0.00001
paired_bootstrap_seed = 20260825
paired_bootstrap_replicates = 10000
paired_bootstrap_confidence = 0.95
minimum_macro_auc_delta = 0.005
minimum_bootstrap_positive_fraction = 0.95
large_target_regression = 0.02
