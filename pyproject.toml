[project]
name = "rsna-knee"
version = "0.1.0"
description = "CPU-first foundations for RSNA knee abnormality detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydicom>=3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsna_knee"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/competition.json" = "rsna_knee/competition.json"
"contracts/data-index.json" = "rsna_knee/data-index.json"
"contracts/gold-supervision.json" = "rsna_knee/gold-supervision.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
