[project]
name = "rsna-knee"
version = "0.1.0"
description = "CPU-first foundations for RSNA knee abnormality detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydicom>=3.0",
]

[project.optional-dependencies]
training = [
    "opencv-python-headless>=4.12,<5",
    "pandas>=2.2,<3",
    "pyarrow>=18,<23",
    "timm>=1.0,<1.1",
    "torch>=2.10,<2.11",
    "torchvision>=0.25,<0.26",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsna_knee"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/competition.json" = "rsna_knee/competition.json"
"contracts/report-weak-supervision-v1.json" = "rsna_knee/report-weak-supervision-v1.json"
"contracts/dinov2-vits14-lvd142m.json" = "rsna_knee/dinov2-vits14-lvd142m.json"
"contracts/raptor-reference-v1.json" = "rsna_knee/raptor-reference-v1.json"
"contracts/raptor-training-reference-v1.json" = "rsna_knee/raptor-training-reference-v1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "training: checks that require the optional PyTorch/torchvision training extra",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
